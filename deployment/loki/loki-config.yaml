# Loki — single-binary, filesystem-backed log store for the observability profile.
# Free / self-hosted. Fronted by Grafana (Loki datasource); fed by Alloy.
# auth_enabled: false means Loki performs NO tenant authentication and trusts any
# X-Scope-OrgID it receives. That is only safe because Loki is never published:
# it listens on the internal compose network, Caddy does not route to it, and the
# only client is Grafana. Exposing this port would make every service log
# world-readable — logs carry user IDs, job IDs, and request paths.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 7 days. This is the operative retention limit, and it is also a data-protection
  # control, not just a disk-space one: logs contain user and request identifiers,
  # so the window bounds how long that data is held. Raising it means holding
  # personal data longer — check that against whatever retention policy applies
  # before increasing it, and note the filesystem backend has no size cap of its
  # own, so a longer window grows the volume until it fills.
  retention_period: 168h # 7 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_label_names_per_series: 30

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

# No phone-home.
analytics:
  reporting_enabled: false
