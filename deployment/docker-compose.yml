name: fyredocs

services:
  # ==================== INFRASTRUCTURE ====================

  # --- Self-managed, co-located PostgreSQL ---
  # Runs on the same Docker network as the services, so every query is a
  # localhost hop (<1ms) instead of a cross-region round-trip to a cloud DB.
  # Data persists in the named volume `postgres_data` across restarts, rebuilds,
  # and `down`/`up`. It is ONLY lost by `down -v` / `docker volume rm` /
  # `docker volume prune` — never use those on this stack. Off-host durability
  # is the daily pg_dump backup, not the volume.
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fyredocs}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Tuned for this stack: the sum of per-service connection pools is ~155, so
    # max_connections is raised well above Postgres's default of 100. shared_buffers
    # / work_mem are sized conservatively because Postgres shares the VPS with the
    # app and the heavy LibreOffice/OCR/Ghostscript conversions — raise them (and
    # the memory limit) if the VPS has spare RAM, or add PgBouncer to multiplex
    # connections and keep max_connections low.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      # Env-overridable (default unchanged). On hosts small enough that the
      # budgeted db memory limit falls below ~512MB (roughly sub-8GB at 80%),
      # lower DB_SHARED_BUFFERS, or point DATABASE_URL at a managed Postgres.
      - shared_buffers=${DB_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
    # NOTE: postgres:18+ stores data in a major-version subdirectory and expects
    # the volume mounted at /var/lib/postgresql (NOT /var/lib/postgresql/data as
    # in <=17). Mounting at the old path makes 18 refuse to start.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-fyredocs}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 60s
    # Limits are env-driven so deploy.sh's resource budget folds Postgres into the
    # RESOURCE_BUDGET_PCT (80%) cap like every other service. The fallbacks equal
    # the previous hardcoded values, so a plain `docker compose up` is unchanged.
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-1G}
          cpus: "${DB_CPU_LIMIT:-1.5}"
        reservations:
          memory: ${DB_MEM_RESERVATION:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fyredocs_net

  # ==================== CONNECTION POOLER (PgBouncer) ====================
  # Multiplexes the services' ~145 summed pool connections onto a small number
  # of real Postgres backends, so scaling workers no longer walks toward
  # max_connections=200 (audit M3).
  #
  # DARK LAUNCH: the container ships, but services only use it once
  # DATABASE_URL is pointed at pgbouncer:6432 in .env. Reverting is that one
  # line. See docs/developer/architecture/database.md.
  #
  # Transaction pooling caveats, all handled:
  #  - Prepared statements: pgbouncer >= 1.21 tracks them (max_prepared_statements
  #    below), so GORM/pgx's extended protocol works unchanged. If a driver ever
  #    trips on it, append default_query_exec_mode=simple_protocol to the DSN.
  #  - statement_timeout / idle_in_transaction_session_timeout arrive as startup
  #    parameters and MUST be listed in ignore_startup_parameters or connections
  #    are rejected — "ignored" means NOT APPLIED, so deploy.sh sets them
  #    server-side as role-in-database defaults instead. Do not remove that step.
  #  - Session advisory locks (goose migrations) are incompatible with
  #    transaction pooling: migrations connect via DATABASE_URL_DIRECT, and so
  #    does db-backup's pg_dump.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-fyredocs}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      # PgBouncer's virtual `pgbouncer` console database is reachable only by
      # users listed in admin_users/stats_users. The image defaults admin_users
      # to `postgres`, which is not even in the generated userlist.txt (that
      # holds DB_USER only), so every console connection was refused with
      # "FATAL: not allowed" — including the SHOW POOLS / SHOW STATS commands in
      # docs/developer/architecture/database.md. Grant it to the app user.
      ADMIN_USERS: ${POSTGRES_USER}
      POOL_MODE: transaction
      # Clients are cheap; real backends are not. 400 client slots cover the
      # summed service pools (~145) with room for a worker scale-out.
      MAX_CLIENT_CONN: "400"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "5"
      # Prepared-statement tracking (pgbouncer >= 1.21) — required for pgx's
      # extended protocol under transaction pooling.
      MAX_PREPARED_STATEMENTS: "500"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout,idle_in_transaction_session_timeout
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Through the pooler to the REAL database, not the admin console: green
      # only when client -> pgbouncer -> Postgres actually works. That is the
      # property step 1 of the rollout in database.md asserts before
      # DATABASE_URL is flipped to pgbouncer:6432; a console `SHOW VERSION`
      # would stay green with Postgres unreachable.
      test: ["CMD-SHELL", "PGPASSWORD=$$DB_PASSWORD psql -h 127.0.0.1 -p 6432 -U $$DB_USER -d $$DB_NAME -tAc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_MEM_LIMIT:-64M}
          cpus: "${PGBOUNCER_CPU_LIMIT:-0.25}"
        reservations:
          memory: ${PGBOUNCER_MEM_RESERVATION:-16M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fyredocs_net

  redis:
    image: redis:7-alpine
    restart: always
    # maxmemory caps Redis well under the container limit so it never gets
    # OOM-killed; volatile-lru evicts only keys that carry a TTL. Every Fyredocs
    # Redis key has a TTL (plan cache 8h, JWT denylist 8h, upload sessions 30m,
    # rate-limit ZSETs 2x window), so nothing TTL-less is ever evicted.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-400mb} --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512M}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${REDIS_MEM_RESERVATION:-64M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fyredocs_net

  nats:
    image: nats:2.10-alpine
    restart: always
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${NATS_MEM_LIMIT:-256M}
          cpus: "${NATS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${NATS_MEM_RESERVATION:-64M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fyredocs_net

  # ==================== OBJECT STORAGE (MinIO) ====================
  # All file bytes live here. Services talk to minio:9000 over the internal
  # network; browsers reach objects through presigned URLs routed at the
  # Caddy edge (/uploads/*, /outputs/*) — port 9000 is NOT published.
  # The console is bound to localhost only for operators.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # Admin console only, loopback only. Object traffic stays internal.
      - "127.0.0.1:9001:9001"
    healthcheck:
      # The minio image ships curl but not a standalone mc; the documented
      # liveness probe is the health endpoint.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEM_LIMIT:-1G}
          cpus: "${MINIO_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MINIO_MEM_RESERVATION:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fyredocs_net

  # One-shot bucket/lifecycle/user bootstrap. Runs to completion before any
  # service that touches object storage starts (depends_on:
  # service_completed_successfully). Idempotent — safe on every `up`.
  #
  # NO lifecycle rules on either bucket. Any pre-existing uploads rule is
  # cleared. Incomplete multipart uploads are aborted by job-service's
  # in-process cleanup loop.
  #
  # NO object-expiration lifecycle on either bucket: input AND output retention
  # is DB-driven per plan (GUEST_JOB_TTL / FREE_JOB_TTL / PRO_JOB_TTL). The
  # cleanup loop removes a job's input+output objects when its processing_jobs
  # row expires, reaps orphaned uploads on the upload-session TTL, and aborts
  # stale multipart uploads. A bucket expiry rule would wipe free/pro inputs early.
  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # Wait for MinIO to accept connections (alias set probes the server)
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."; sleep 1
        done

        # Create both buckets (-p: no error if they already exist)
        mc mb -p "local/$$S3_BUCKET_UPLOADS"
        mc mb -p "local/$$S3_BUCKET_OUTPUTS"

        # NO object-expiry lifecycle on uploads — input/output retention is
        # DB-driven per plan (job-service's cleanup loop). Clear any
        # pre-existing rule (e.g. an older 2-day expiry) so it can't wipe
        # inputs early. Incomplete multipart uploads are aborted by the
        # cleanup loop (abortStaleMultipartUploads, 24h), so no bucket rule
        # is needed.
        mc ilm rule remove --all --force "local/$$S3_BUCKET_UPLOADS" 2>/dev/null || true

        # Scoped application credentials: services never use the root key.
        # RW on the two fyredocs buckets only.
        cat > /tmp/fyredocs-app-policy.json <<POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::$$S3_BUCKET_UPLOADS", "arn:aws:s3:::$$S3_BUCKET_OUTPUTS"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
              "Resource": ["arn:aws:s3:::$$S3_BUCKET_UPLOADS/*", "arn:aws:s3:::$$S3_BUCKET_OUTPUTS/*"]
            }
          ]
        }
        POLICY
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy create local fyredocs-app /tmp/fyredocs-app-policy.json
        mc admin policy attach local fyredocs-app --user "$$S3_ACCESS_KEY" || true

        echo "minio-init complete"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-uploads}
      S3_BUCKET_OUTPUTS: ${S3_BUCKET_OUTPUTS:-outputs}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fyredocs_net

  # ==================== EDGE (Caddy) ====================
  # Public entrypoint: TLS termination, SPA static files, direct
  # browser<->MinIO byte routing (presigned URLs), and API proxying to the
  # api-gateway. See deployment/caddy/Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set to your public domain to enable automatic HTTPS; leave unset
      # for plain HTTP on :80 (local/dev). The :80 default must be applied
      # HERE: compose always defines the variable in the container, and
      # Caddy's {$VAR:default} fallback ignores defined-but-empty values.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-:80}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-uploads}
      S3_BUCKET_OUTPUTS: ${S3_BUCKET_OUTPUTS:-outputs}
      # Ad-network hosts appended to the CSP script/img/connect/frame-src (empty =
      # strict, same-origin only). Set CSP_AD_DOMAINS in .env to enable ads.
      CSP_AD_DOMAINS: ${CSP_AD_DOMAINS:-}
      # Internal port the api-gateway listens on. Must match the gateway's PORT.
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8080}
      # Upstream addresses the Caddyfile proxies to. Defaults are the single-host
      # container names; on a multi-host deploy set each to a real host:port. All
      # four MUST be given a concrete value here rather than left to the
      # Caddyfile's {$VAR:default} fallback — compose always defines the variable
      # in the container, and that fallback ignores defined-but-empty values (see
      # the PUBLIC_DOMAIN note above).
      #
      # API_GATEWAY_UPSTREAMS is space-separated and load balanced, e.g.
      #   API_GATEWAY_UPSTREAMS="app1.internal:8080 app2.internal:8080"
      API_GATEWAY_UPSTREAMS: ${API_GATEWAY_UPSTREAMS:-api-gateway:${API_GATEWAY_PORT:-8080}}
      # Single gateway used only for the /grafana forward_auth probe — it must be
      # ONE address, not a list, so it cannot reuse API_GATEWAY_UPSTREAMS.
      AUTHZ_UPSTREAM: ${AUTHZ_UPSTREAM:-api-gateway:${API_GATEWAY_PORT:-8080}}
      # Object bytes (/uploads/*, /outputs/*) are relayed here. Multi-host: the
      # data host's private address.
      MINIO_UPSTREAM: ${MINIO_UPSTREAM:-minio:9000}
      GRAFANA_UPSTREAM: ${GRAFANA_UPSTREAM:-grafana:3000}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../fyredocs_frontend/dist:/srv/spa:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEM_LIMIT:-256M}
          cpus: "${CADDY_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${CADDY_MEM_RESERVATION:-64M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api-gateway:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - fyredocs_net

  # ==================== API GATEWAY ====================
  # Internal-only: Caddy is the public edge. The gateway no longer serves
  # the SPA or relays MinIO bytes — it only verifies auth, rate-limits, and
  # routes API traffic to services.
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    restart: always
    # Internal-only (Caddy is the public edge). The listen port is configurable
    # via API_GATEWAY_PORT so it need not sit at a well-known/sequential value;
    # this is NOT host-published, so it is defense-in-depth on the internal net.
    expose:
      - "${API_GATEWAY_PORT:-8080}"
    environment:
      PORT: "${API_GATEWAY_PORT:-8080}"
      JOB_SERVICE_URL: http://job-service:8081
      AUTH_SERVICE_URL: http://auth-service:8086
      ANALYTICS_SERVICE_URL: http://analytics-service:8087
      DOCUMENT_SERVICE_URL: http://document-service:8089
      USER_SERVICE_URL: http://user-service:8090
      NOTIFICATION_SERVICE_URL: http://notification-service:8091
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"

      # JWT Configuration
      JWT_HS256_SECRET: ${JWT_HS256_SECRET}
      JWT_ALLOWED_ALGS: "HS256"
      JWT_ISSUER: "fyredocs"
      JWT_AUDIENCE: "fyredocs-api"
      JWT_CLOCK_SKEW: "60s"

      # Auth Configuration
      AUTH_GUEST_PREFIX: "guest"
      AUTH_GUEST_SUFFIX: "jobs"
      AUTH_DENYLIST_ENABLED: "true"
      AUTH_DENYLIST_PREFIX: "denylist:jwt"

      # CORS Configuration (kept for local dev when frontend runs separately)
      CORS_ALLOW_ORIGINS: "http://localhost:5173,http://localhost:3000"
      CORS_ALLOW_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOW_HEADERS: "Authorization,Content-Type,X-User-ID"
      CORS_ALLOW_CREDENTIALS: "true"

      # Trusted proxies for client-IP resolution (rightmost-untrusted XFF).
      # Same list the Gin services use; without it guests collapse into one
      # shared rate-limit bucket (over-throttles, never under-throttles).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16,127.0.0.1,::1}

      # Per-plan API rate limits (requests per window, keyed by user; guests by IP).
      # These MUST be declared here to reach the container: compose only uses .env
      # to interpolate ${...} into THIS file, it does not inject .env into
      # containers. Without these lines scripts/k6/capacity-mode.env is silently
      # inert and a load test measures the limiter instead of the backend.
      # Defaults mirror api-gateway/main.go exactly, so omitting them changes nothing.
      RATE_LIMIT_API_GUEST: ${RATE_LIMIT_API_GUEST:-30}
      RATE_LIMIT_API_FREE: ${RATE_LIMIT_API_FREE:-120}
      RATE_LIMIT_API_PRO: ${RATE_LIMIT_API_PRO:-600}
      RATE_LIMIT_API_WINDOW: ${RATE_LIMIT_API_WINDOW:-1m}

      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    healthcheck:
      # Exec form (images are scratch — no /bin/sh); ${API_GATEWAY_PORT} is
      # substituted by compose at config time, not by a shell in the container.
      test: ["CMD", "./healthcheck", "http://localhost:${API_GATEWAY_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${API_GATEWAY_MEM_LIMIT:-256M}
          cpus: "${API_GATEWAY_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${API_GATEWAY_MEM_RESERVATION:-64M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      job-service:
        condition: service_started
      analytics-service:
        condition: service_started
      document-service:
        condition: service_started
      user-service:
        condition: service_started
      # notification-service intentionally omitted: it is disabled by default
      # (notifications profile). The gateway proxies /api/notifications on demand
      # and NOTIFICATION_SERVICE_URL below still resolves when it is enabled.
    networks:
      - fyredocs_net

  # ==================== AUTH SERVICE ====================
  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    restart: always
    environment:
      PORT: "8086"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deployment/.env}
      # Migrations take a session advisory lock, which transaction-mode
      # pooling breaks — they always connect straight to Postgres.
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      NATS_URL: ${NATS_URL:-nats://nats:4222}

      # JWT Configuration
      JWT_HS256_SECRET: ${JWT_HS256_SECRET}
      JWT_ALLOWED_ALGS: "HS256"
      JWT_ISSUER: "fyredocs"
      JWT_AUDIENCE: "fyredocs-api"
      JWT_CLOCK_SKEW: "60s"
      JWT_ACCESS_TTL: "8h"
      JWT_REFRESH_TTL: "168h"
      # Grace window for concurrent refreshes before a superseded refresh
      # token counts as reuse (theft) and revokes the session.
      AUTH_REFRESH_ROTATE_GRACE: ${AUTH_REFRESH_ROTATE_GRACE:-30s}

      # Auth Cookie Settings
      AUTH_COOKIE_DOMAIN: ""
      # Default preserved for HTTP/dev; set AUTH_COOKIE_SECURE=true in the
      # production .env so auth cookies carry the Secure flag over HTTPS.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: "lax"
      AUTH_REFRESH_COOKIE: "refresh_token"

      # Auth Denylist
      AUTH_DENYLIST_ENABLED: "true"
      AUTH_DENYLIST_PREFIX: "denylist:jwt"

      # Rate Limiting (per IP). Interpolated, not hardcoded: as literals these
      # PINNED the limits, so scripts/k6/capacity-mode.env could never raise them
      # and a load run measured the limiter instead of the backend. Values are
      # unchanged — they still match auth-service/routes/routes.go.
      # NOTE RATE_LIMIT_SIGNUP=3/min: k6's provisionUsers() signs a pool up in a
      # tight loop, so without capacity-mode it silently gets ~3 users, and the
      # per-user API quota that implies becomes the "capacity" it measures.
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5}
      RATE_LIMIT_SIGNUP: ${RATE_LIMIT_SIGNUP:-3}
      RATE_LIMIT_REFRESH: ${RATE_LIMIT_REFRESH:-10}
      RATE_LIMIT_FORGOT_PASSWORD: ${RATE_LIMIT_FORGOT_PASSWORD:-3}
      RATE_LIMIT_RESET_PASSWORD: ${RATE_LIMIT_RESET_PASSWORD:-5}
      RATE_LIMIT_PROXY_LOGIN: ${RATE_LIMIT_PROXY_LOGIN:-5}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60s}

      # Password Reset / Email (Resend)
      # Leave RESEND_API_KEY blank to fall back to the no-op mailer (logs the
      # reset link to stdout instead of sending an email).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESET_EMAIL_FROM: ${RESET_EMAIL_FROM:-no-reply@fyredocs.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      PASSWORD_RESET_TOKEN_TTL: "1h"

      # Proxy login (admin impersonation)
      PROXY_LOGIN_ENABLED: ${PROXY_LOGIN_ENABLED:-true}
      PROXY_LOGIN_TTL: ${PROXY_LOGIN_TTL:-30m}

      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16,127.0.0.1,::1}
      # Shared secret guarding mesh-only /internal routes (fails closed when
      # unset). Must be identical across all services. See .env.example.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    healthcheck:
      test: ["CMD", "./healthcheck", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${AUTH_SERVICE_MEM_LIMIT:-256M}
          cpus: "${AUTH_SERVICE_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${AUTH_SERVICE_MEM_RESERVATION:-64M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - fyredocs_net

  # ==================== JOB SERVICE (formerly upload-service) ====================
  job-service:
    build:
      context: ..
      dockerfile: job-service/Dockerfile
    restart: always
    # Let the background sweep/pollers finish before SIGKILL.
    stop_grace_period: 30s
    environment:
      PORT: "8081"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deployment/.env}
      # Migrations take a session advisory lock, which transaction-mode
      # pooling breaks — they always connect straight to Postgres.
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      NATS_URL: ${NATS_URL:-nats://nats:4222}

      # JWT Configuration
      JWT_HS256_SECRET: ${JWT_HS256_SECRET}
      JWT_ALLOWED_ALGS: "HS256"
      JWT_ISSUER: "fyredocs"
      JWT_AUDIENCE: "fyredocs-api"
      JWT_CLOCK_SKEW: "60s"

      # Auth settings
      AUTH_GUEST_PREFIX: "guest"
      AUTH_GUEST_SUFFIX: "jobs"
      AUTH_DENYLIST_ENABLED: "true"
      AUTH_DENYLIST_PREFIX: "denylist:jwt"
      # Was hardcoded "true", which is only sound while the gateway is the sole
      # thing that can reach this port. Once app servers span hosts that stops
      # being true, so the default flips to false and the JWT is verified here.
      # The gateway forwards Authorization untouched (it clears only X-User-*),
      # so the token is available to verify — see api-gateway/main.go newProxy.
      AUTH_TRUST_GATEWAY_HEADERS: ${AUTH_TRUST_GATEWAY_HEADERS:-false}

      # Share links (Phase 6): the public origin minted into share URLs —
      # must be the gateway's public address, not this service's. Unset in
      # dev, where the request Host fallback is good enough.
      SHARE_BASE_URL: ${SHARE_BASE_URL:-}
      RATE_LIMIT_SHARE_REDEEM: ${RATE_LIMIT_SHARE_REDEEM:-30}

      # Object storage (MinIO)
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-uploads}
      S3_BUCKET_OUTPUTS: ${S3_BUCKET_OUTPUTS:-outputs}
      # Presigned URLs are signed for the origin browsers actually use (the
      # gateway). Multi-host: point this at the public origin instead.
      S3_PUBLIC_ENDPOINT: ${PUBLIC_ORIGIN:-http://localhost}
      UPLOAD_PART_SIZE_MB: "${UPLOAD_PART_SIZE_MB:-8}"

      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16,127.0.0.1,::1}
      # Shared secret guarding mesh-only /internal routes (fails closed when
      # unset). Must be identical across all services. See .env.example.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      GUEST_JOB_TTL: ${GUEST_JOB_TTL:-30m}
      FREE_JOB_TTL: ${FREE_JOB_TTL:-168h}
      PRO_JOB_TTL: ${PRO_JOB_TTL:-720h}
      UPLOAD_TTL: 30m

      # Per-IP job/upload rate limits. Declared here so they actually reach the
      # container — see the note in the api-gateway block. Defaults mirror
      # job-service/routes/upload_routes.go exactly.
      # NOTE these bite during load tests well before the workers do: a presigned
      # job costs 1 job-create + several uploads, so UPLOAD=30/min caps job
      # throughput around 12-15 jobs/min regardless of how fast the workers are.
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60s}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-30}
      RATE_LIMIT_JOB_CREATE: ${RATE_LIMIT_JOB_CREATE:-20}
      RATE_LIMIT_DETECT: ${RATE_LIMIT_DETECT:-60}

      # In-process TTL sweep (expired jobs, upload sessions, stale multipart
      # uploads). Runs inside this container — job-service owns all the data
      # it touches. Set CLEANUP_ENABLED=false on extra replicas so exactly
      # one sweeper runs.
      CLEANUP_ENABLED: "true"
      CLEANUP_INTERVAL: 5m
      MULTIPART_ABORT_TTL: ${MULTIPART_ABORT_TTL:-24h}

      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    healthcheck:
      test: ["CMD", "./healthcheck", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${JOB_SERVICE_MEM_LIMIT:-512M}
          cpus: "${JOB_SERVICE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${JOB_SERVICE_MEM_RESERVATION:-128M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - fyredocs_net

  # ==================== CONVERT FROM PDF (worker) ====================
  convert-from-pdf:
    build:
      context: ..
      dockerfile: convert-from-pdf/Dockerfile
    restart: always
    # PID 1 reaper: LibreOffice/Ghostscript/tesseract spawn grandchildren that
    # would otherwise accumulate as zombies over long uptimes.
    init: true
    # Drain window for in-flight PDF jobs on SIGTERM. MUST exceed
    # WORKER_DRAIN_TIMEOUT below, or Docker SIGKILLs the worker mid-drain.
    stop_grace_period: 3m
    environment:
      PORT: "8082"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deployment/.env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      NATS_URL: ${NATS_URL:-nats://nats:4222}

      # Object storage (MinIO) — workers stream inputs/outputs; /tmp is the
      # only local scratch space (tmpfs below)
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-uploads}
      S3_BUCKET_OUTPUTS: ${S3_BUCKET_OUTPUTS:-outputs}

      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16,127.0.0.1,::1}

      # Parallel jobs per container (pdf2docx/LibreOffice are CPU-heavy).
      # Overridable per host: on a VS-32-class box (16 cores) try 3-4.
      WORKER_CONCURRENCY: "${CONVERT_FROM_PDF_CONCURRENCY:-2}"
      # Bounded drain on shutdown; must stay under stop_grace_period.
      WORKER_DRAIN_TIMEOUT: ${WORKER_DRAIN_TIMEOUT:-120s}
      # Result cache: identical input+tool+options reuse a prior output. Keep at
      # or below the outputs bucket TTL. Set to 0 to disable caching.
      RESULT_CACHE_TTL_SECONDS: "${RESULT_CACHE_TTL_SECONDS:-3600}"

      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    tmpfs:
      - /tmp:size=1g
    healthcheck:
      # Runtime image is python:3.11-slim (Debian) which has no wget/curl; use the
      # bundled python3. urlopen raises (non-zero exit) on any non-2xx or connection error.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${CONVERT_FROM_PDF_MEM_LIMIT:-1G}
          cpus: "${CONVERT_FROM_PDF_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${CONVERT_FROM_PDF_MEM_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - fyredocs_net

  # ==================== CONVERT TO PDF (worker) ====================
  convert-to-pdf:
    build:
      context: ..
      dockerfile: convert-to-pdf/Dockerfile
    restart: always
    # PID 1 reaper: LibreOffice/Ghostscript/tesseract spawn grandchildren that
    # would otherwise accumulate as zombies over long uptimes.
    init: true
    # Drain window for in-flight PDF jobs on SIGTERM. MUST exceed
    # WORKER_DRAIN_TIMEOUT below, or Docker SIGKILLs the worker mid-drain.
    stop_grace_period: 3m
    environment:
      PORT: "8083"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deployment/.env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      NATS_URL: ${NATS_URL:-nats://nats:4222}

      # Object storage (MinIO)
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-uploads}
      S3_BUCKET_OUTPUTS: ${S3_BUCKET_OUTPUTS:-outputs}

      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16,127.0.0.1,::1}
      # Overridable per host: on a VS-32-class box (16 cores) try 3-4.
      WORKER_CONCURRENCY: "${CONVERT_TO_PDF_CONCURRENCY:-2}"
      # Bounded drain on shutdown; must stay under stop_grace_period.
      WORKER_DRAIN_TIMEOUT: ${WORKER_DRAIN_TIMEOUT:-120s}
      # unoserver (LibreOffice) daemon pool. Leave UNSET to auto-size to
      # WORKER_CONCURRENCY + 1 (one warm daemon per concurrent job plus a spare),
      # which keeps the slow cold-start LibreOffice fallback unreachable. Set
      # explicitly only to pin it. Each instance adds ~150-300 MB RAM; raise the
      # memory limit below before increasing concurrency.
      UNOSERVER_INSTANCES: "${UNOSERVER_INSTANCES:-}"
      # Result cache (see convert-from-pdf). 0 disables.
      RESULT_CACHE_TTL_SECONDS: "${RESULT_CACHE_TTL_SECONDS:-3600}"

      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    tmpfs:
      - /tmp:size=1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Grace window before failures count: cold start (image init,
      # migrations, LibreOffice warm-up) must not flag the container unhealthy.
      start_period: 60s
    deploy:
      # On a single box, prefer raising WORKER_CONCURRENCY + UNOSERVER_INSTANCES
      # within one replica over running multiple replicas (avoids duplicate
      # LibreOffice daemon pools competing for the same cores). Scale out by
      # replicas only when adding a second host. NOTE limits are PER REPLICA.
      replicas: ${CONVERT_TO_PDF_REPLICAS:-1}
      resources:
        limits:
          memory: ${CONVERT_TO_PDF_MEM_LIMIT:-1G}
          cpus: "${CONVERT_TO_PDF_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${CONVERT_TO_PDF_MEM_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - fyredocs_net

