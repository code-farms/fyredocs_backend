# Grafana dashboard provider — loads JSON dashboards from disk at startup.

apiVersion: 1

providers:
  - name: fyredocs
    orgId: 1
    folder: fyredocs
    type: file
    # editable: true lets an operator adjust a panel live while investigating,
    # which is the point — but provisioned dashboards are reloaded from disk, so
    # in-UI edits are NOT durable and are lost on restart. Anything worth keeping
    # must be exported back into deployment/grafana/dashboards/ as JSON.
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
