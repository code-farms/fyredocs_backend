  /admin/metrics/acquisition:
    get:
      tags:
      - Admin Analytics
      summary: Acquisition metrics (new users, guest→registered conversion)
      description: 'New-user acquisition over the window with a period-over-period delta,

        plus guest-to-registered conversion — how many guest sessions ended in

        a signup.

        '
      operationId: adminAcquisitionMetrics
      parameters:
      - name: days
        in: query
