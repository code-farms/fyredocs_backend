  /api/documents/{id}/download:
    get:
      tags:
      - Documents
      summary: Download the document's stored bytes
      description: '302 to a 5-minute presigned GET on object storage with

        `Content-Disposition: attachment` (and the stored mimeType when set) —

        the browser fetches the bytes straight from storage, not through the

        service. Only documents with a `storagePath` have bytes here; job-era

        rows without one answer 404 (fall back to the job download route).

        '
      operationId: downloadDocument
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: orgId
        in: query
        description: Org scope (viewer+)
        schema:
          type: string
          format: uuid
      responses:
        '302':
          description: Redirect to a presigned download URL (5-minute expiry, attachment disposition)
          headers:
            Location:
              schema:
                type: string
                example: http://localhost/outputs/backups/<userId>/<uuid>/invoice.pdf?response-content-disposition=attachment%3B%20filename%3D%22invoice.pdf%22&X-Amz-Signature=...
        '404':
          description: Document not found
          not owned: null
          or has no stored file: null
        '500':
          description: Downloads unavailable (object storage unconfigured) or presign failure
  /api/documents/{id}/restore:
    post:
      tags:
      - Documents
      summary: Restore a soft-deleted document
      operationId: restoreDocument
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
