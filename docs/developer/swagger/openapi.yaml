          format: uuid
      responses:
        '200':
          description: Restored
        '404':
          description: Not found in Trash
  /api/documents/{id}/permanent:
    delete:
      tags:
      - Documents
      summary: Permanently delete a document
      description: 'Hard delete (row + tag associations). When `storagePath` starts with

        `backups/` the storage object is also deleted (best-effort, row first)

        — this purge is the only deletion path for backup bytes; job-service''s

        cleanup sweeps never touch backups/.

        '
      operationId: purgeDocument
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Permanently deleted
        '404':
          description: Not found
