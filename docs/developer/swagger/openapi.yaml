  /api/organize-pdf/detect-edges:
    post:
      tags:
      - Organize PDF
      summary: Detect document edges in an uploaded photo
      description: 'Detects the document quad in a completed image upload for the mobile

        scanner UI. The upload is **peeked at, not consumed** — the same

        `uploadId` remains valid for a subsequent scan-to-pdf job. job-service

        synchronously relays the request to the organize-pdf service''s internal

        detection endpoint (pure-Go pipeline; 15 second timeout).


        Corners are normalized `0..1` against the **decoded pixel grid** (EXIF

        orientation is ignored server-side). When no document is found the

        response still succeeds with full-image corners and `confidence: 0`.

        The returned `corners` object can be passed directly into the

        scan-to-pdf `options.pages[i].corners` field (see `ScanToPdfOptions`).


        Rate-limited per IP at `RATE_LIMIT_DETECT` (default 60 per window).

        '
      operationId: detectEdges
      security:
      - BearerAuth: []
      - CookieAuth: []
      - GuestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - uploadId
              properties:
                uploadId:
                  type: string
                  format: uuid
                  description: ID of a completed presigned upload (image only — PDF uploads are rejected)
      responses:
        '200':
          description: Edges detected (full-image corners with confidence 0 when no document is found)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DetectEdgesResult'
        '400':
          description: Missing/unknown uploadId, or the upload is a PDF
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/APIError'
                      example:
                        code: INVALID_INPUT
                        details: Edge detection requires an image upload, not a PDF.
        '422':
          description: The image could not be analyzed (upstream error code relayed, e.g. UNDECODABLE_IMAGE,
            IMAGE_TOO_LARGE)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/APIError'
                      example:
                        code: UNDECODABLE_IMAGE
                        details: The upload is not a decodable image.
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: Edge detection temporarily unavailable (organize-pdf down, 5xx, or timeout)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/APIError'
                      example:
                        code: DETECTION_UNAVAILABLE
                        details: Edge detection is temporarily unavailable.
