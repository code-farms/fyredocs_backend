  /api/upload/{uploadId}/complete:
    post:
      tags:
      - Uploads
      summary: Complete a presigned multipart upload
      description: 'Finalizes the S3 multipart upload from the client-collected part ETags.

        The part count must equal `totalParts` from init. After completion the

        service stats the object and re-verifies the **true** size against the

        caller''s plan limit — oversized objects are deleted and 413 returned.

        '
      operationId: completeUpload
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The upload session ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompleteRequest'
      responses:
        '200':
          description: Upload completed and size-verified
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        uploadId:
                          type: string
                          format: uuid
                        fileName:
                          type: string
                        size:
                          type: integer
                          format: int64
                          description: True object size in bytes
                        complete:
                          type: boolean
                          example: true
        '400':
          description: Part count mismatch or object storage rejected the part list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/APIError'
                      example:
                        code: UPLOAD_INCOMPLETE
                        details: Expected 3 uploaded parts but received 2. Please finish uploading all
                          parts first.
        '413':
          description: True object size exceeds plan limit (object is deleted)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/APIError'
                      example:
                        code: FILE_TOO_LARGE
                        details: File size exceeds the 25MB limit for your plan
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
