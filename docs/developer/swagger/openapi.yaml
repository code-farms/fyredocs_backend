      summary: Executive overview (headline KPIs with period-over-period deltas)
      description: 'Single-call summary for the admin landing page: signups, active users,

        jobs processed, conversion, and revenue for the window, each compared

        against the immediately preceding window of the same length.

        '
      operationId: adminExecutiveOverview
      parameters:
