  /admin/metrics/server-performance:
    get:
      tags:
      - Admin Analytics
      summary: Server performance (CPU, memory, storage, uptime, service availability)
      description: 'Returns system-level metrics (CPU usage, memory, disk, load averages, uptime)

        and per-service Go runtime metrics (goroutines, heap, GC) by scraping each

        service''s Prometheus /metrics endpoint. Also reports service availability

        via health checks.

        '
      operationId: adminServerPerformance
      responses:
        '200':
          description: Server performance metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
  /admin/metrics/api-performance:
    get:
      tags:
      - Admin Analytics
      summary: API performance (latency percentiles, throughput, error rates per endpoint)
      description: 'Scrapes the API gateway''s Prometheus metrics to compute per-endpoint

        latency (p50/p95/p99), request count, and error rates. Also returns

        the top 5 slowest and highest-error-rate endpoints.

        The endpoints list supports server-side pagination, search, and sorting.

        '
      operationId: adminAPIPerformance
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Page number for endpoints list
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
        description: Items per page for endpoints list
      - name: search
        in: query
        schema:
          type: string
        description: Partial match on endpoint path (case-insensitive)
      - name: method
        in: query
        schema:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        description: Exact match on HTTP method
      - name: sortBy
        in: query
        schema:
          type: string
          default: requests
          enum:
          - requests
          - avgLatencyMs
          - p50LatencyMs
          - p95LatencyMs
          - p99LatencyMs
          - errorRate
          - path
          - method
        description: Field to sort endpoints by
      - name: sortDir
        in: query
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
        description: Sort direction
      responses:
        '200':
          description: API performance metrics with paginated endpoints and meta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
  /api/documents:
    get:
      tags:
      - Documents
      summary: List documents
      operationId: listDocuments
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - uploaded
          - processing
          - ready
          - failed
      - name: folderId
        in: query
        schema:
          type: string
          format: uuid
      - name: tagId
        in: query
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Full-text search (name + extracted content)
        schema:
          type: string
      - name: trashed
        in: query
        description: true returns the Trash view
        schema:
          type: boolean
      - name: updatedSince
        in: query
        description: 'Delta sync: only rows updated strictly after this instant. Invalid values are 400,
          not ignored.'
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        description: 'updated orders by updatedAt DESC (default: createdAt DESC) — modification order
          for sync clients'
        schema:
          type: string
          enum:
          - updated
      - name: orgId
        in: query
        description: Org-scope the listing (viewer+)
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: Paginated documents (data[] + meta{page,limit,total})
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
    post:
      tags:
      - Documents
      summary: Create a document (metadata only)
      operationId: createDocument
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                folderId:
                  type: string
                  format: uuid
                organizationId:
                  type: string
                  format: uuid
                  description: Org-scope (editor+)
                fileType:
                  type: string
                mimeType:
                  type: string
                fileSize:
                  type: integer
                  format: int64
                storagePath:
                  type: string
                  description: Object key of the document's bytes. Keys under backups/ must sit under
                    the caller's own backups/{userId}/ prefix (the storageKey returned by POST /api/backup)
                    — 400 otherwise. Other shapes pass through unvalidated.
                status:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Validation error (including a backups/ storagePath not owned by the caller)
  /api/documents/{id}:
