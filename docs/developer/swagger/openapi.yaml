    get:
      tags:
      - Admin Analytics
      summary: Job queue status (pending, in-flight, dead-lettered)
      description: 'Reports the state of the processing pipeline from the JetStream streams

        and the job tables: queued/processing counts per tool, consumer lag, and

        the dead-letter queue depth. Used by the admin dashboard''s queue panel.

        '
      operationId: adminQueueStatus
      responses:
        '200':
          description: Queue status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/metrics/api-trends:
    get:
      tags:
      - Admin Analytics
      summary: API traffic and latency trend series
      description: 'Time series of request volume, latency, and error rate built from the

        `api_metric_samples` rows the analytics sampler writes (counters alone

        carry no history). Ranges of 2 days or less are bucketed per hour,

        longer ranges per day.

        '
      operationId: adminAPITrends
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 7
        description: Look-back window in days
      responses:
        '200':
          description: API trend series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/metrics/executive:
    get:
      tags:
